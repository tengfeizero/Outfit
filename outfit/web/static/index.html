<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0B0B0C" />
    <title>今天穿什么</title>
    <script>
      // 出错时把原因写在屏幕上。这个应用装在自己电脑上，出问题没人能开控制台看，
      // 一片黑是最难查的状态——至少要知道是脚本没加载，还是渲染时抛了异常。
      window.addEventListener("error", function (event) {
        var root = document.getElementById("root");
        if (!root) return;
        while (root.firstChild) root.removeChild(root.firstChild);
        var box = document.createElement("pre");
        box.style.cssText =
          "padding:24px;color:#EDEAE4;background:#0B0B0C;min-height:100vh;margin:0;" +
          "font:13px/1.7 ui-monospace,SFMono-Regular,Menlo,monospace;white-space:pre-wrap;word-break:break-all";
        var where = event.filename ? event.filename + ":" + event.lineno : "（加载阶段）";
        box.textContent =
          "页面出错了\n\n" + (event.message || "未知错误") + "\n\n" + where +
          "\n\n把这段文字发给我就行。";
        document.body.style.background = "#0B0B0C";
        root.appendChild(box);
      });
    </script>
    <script type="module" crossorigin src="/assets/index-BgnPvOf-.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-h7JcRBjV.css">
  </head>
  <body>
    <div id="root"></div>
    <noscript>这个页面需要开启 JavaScript。</noscript>
  </body>
</html>
